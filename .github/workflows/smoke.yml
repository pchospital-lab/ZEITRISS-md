name: ZEITRISS CI Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci_smoke:
    name: ci_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        # --user: jsonschema muss ins HOME-gebundene User-Site (site.getusersitepackages()),
        # damit die mmo_sim-C3-Regressionen (fresh-HOME-Kindprozesse) weiter fail-closed greifen.
        run: python3 -m pip install --user -r requirements-ci.txt

      - name: Run unit tests
        run: python3 -m unittest -q

      - name: Run mmo_sim regression tests
        run: python3 -u tests/mmo_sim/run_all.py

      - name: Run smoke
        shell: bash
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee smoke.log

      - name: Generate LINT catalog
        run: python3 scripts/generate_lint_catalog.py

      - name: Show LINT catalog diff (non-blocking)
        run: git diff -- docs/LINT-CATALOG.md --exit-code || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-smoke-logs
          path: |
            smoke.log
            docs/LINT-CATALOG.md
            .smoke/**/*
          retention-days: 7
