# LiteLLM-Proxy für ZEITRISS.
#
# Starten:
#   cd scripts/litellm
#   cp .env.example .env   # und Keys eintragen, wenn ihr nicht das setup-Script nutzt
#   docker compose -f docker-compose.litellm.yml --env-file .env up -d
#
# Oder bequemer: `python scripts/setup.py --install-litellm`
# legt .env mit generiertem Master-Key an und startet den Container.

# Compose-Projektname explizit an den eindeutigen Container-Namen binden.
# Jeder Bausatz hat ein `scripts/litellm/`-Verzeichnis; ohne diese Zeile leitet
# Compose den Projektnamen vom Ordner ab und der heißt bei ALLEN `litellm`. Folge:
# alle Bausätze teilen das Projekt `litellm`, und ein rohes `docker compose
# up/down` ohne `-p` reißt die Container der anderen Bausätze mit ab (nur
# der zuletzt erzeugte überlebt; Vorfälle 2026-06-10 und 2026-09-14).
# Compose lädt `./.env` automatisch, daher greift der eindeutige Wert auch
# ohne `--env-file`. setup.py setzt zusätzlich `-p` mit demselben Wert.
name: ${LITELLM_CONTAINER_NAME:-litellm-zeitriss}

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ${LITELLM_CONTAINER_NAME:-litellm-zeitriss}
    restart: unless-stopped

    # Loopback-only: Der Proxy ist von außen nicht erreichbar, nur vom
    # selben Host (da wo OpenWebUI auch läuft). Das ist Absicht — LiteLLM
    # hat keinen eigenen Auth-Layer über den master_key hinaus.
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:${LITELLM_PORT:-4000}"

    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}

    volumes:
      # Config read-only eingehängt — Änderungen erfordern Container-Restart.
      - ./config.yaml:/app/config.yaml:ro

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "${LITELLM_PORT:-4000}"
      - "--num_workers"
      - "1"

    healthcheck:
      # LiteLLM stellt einen Health-Endpoint ohne Auth bereit.
      # Wichtig: Das litellm-Image (Wolfi-basiert) hat kein `curl`, nur
      # `python3`. Daher Python statt curl — funktioniert in allen
      # Varianten des offiziellen Images.
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:${LITELLM_PORT:-4000}/health/liveness'', timeout=3).status==200 else 1)" || exit 1'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
